name: CI & Auto-Deploy (Ads AI Publisher)

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  test-and-deploy:
    name: Run SQLite Tests & Trigger Auto-Deploy
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup PHP 8.2
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2'
          extensions: mbstring, xml, ctype, json, curl, gd, pdo_sqlite, sqlite3
          coverage: none

      - name: Install Composer Dependencies
        run: composer install --no-interaction --prefer-dist

      - name: Prepare SQLite Test Environment
        run: |
          cp .env.example .env
          php artisan key:generate
          touch database/database.sqlite
          DB_CONNECTION=sqlite php artisan migrate --force

      - name: Run Feature & Unit Tests (SQLite)
        run: DB_CONNECTION=sqlite php artisan test

      - name: Trigger Server Webhook Auto-Deploy (if DEPLOY_WEBHOOK_URL secret is configured)
        if: ${{ secrets.DEPLOY_WEBHOOK_URL != '' }}
        env:
          WEBHOOK_URL: ${{ secrets.DEPLOY_WEBHOOK_URL }}
          WEBHOOK_SECRET: ${{ secrets.DEPLOY_WEBHOOK_SECRET }}
        run: |
          PAYLOAD='{"ref":"refs/heads/main","pusher":{"name":"GitHub-Actions-CI"}}'
          SIGNATURE="sha256=$(echo -n "${PAYLOAD}" | openssl dgst -sha256 -hmac "${WEBHOOK_SECRET}" | awk '{print $2}')"
          curl -f -sS -X POST "${WEBHOOK_URL}" \
            -H "Content-Type: application/json" \
            -H "X-GitHub-Event: push" \
            -H "X-Hub-Signature-256: ${SIGNATURE}" \
            -H "X-Deploy-Token: ${WEBHOOK_SECRET}" \
            -d "${PAYLOAD}"
