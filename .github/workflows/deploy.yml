name: Auto Deploy Ads AI

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  deploy:
    name: Executing remote SSH commands
    runs-on: ubuntu-latest
    steps:
      - name: Executing remote SSH commands
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: 103.155.193.161
          username: root
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          port: 2222
          script: |
            cd /root/agy/metaads-ai-publisher
            ./deploy.sh main
